# One service: the Dockerfile builds the React UI and serves it from FastAPI on port 8000.
services:
  sabwat:
    build: .
    ports:
      - "8000:8000"
    # Secrets from the deploy platform: read from ./.env at run time if it exists (never baked into the
    # image; .dockerignore excludes it), plus straight passthrough of the host environment.
    env_file:
      - path: .env
        required: false
    environment:
      - LLM_PROVIDER
      - GEMINI_API_KEY
      - GEMINI_MODEL
      - GEMINI_FALLBACK_MODEL
      - ANTHROPIC_API_KEY
      - BEDROCK_MODEL_ID
      - AWS_REGION
      - AWS_BEARER_TOKEN_BEDROCK
      - DB_BACKEND
    restart: unless-stopped
